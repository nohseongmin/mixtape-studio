name: Garden journeys

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '37 20 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  journey:
    name: ${{ matrix.name }}
    runs-on: windows-2025
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Mix and download MP3
            test: test_end_to_end_real_encoding_tags_cover_order_and_cleanup
          - name: Preserve short audio
            test: test_short_tone_survives_render_and_download
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            requirements.txt
            constraints.txt
      - run: python -m pip install -r requirements-dev.txt
      - name: Install FFmpeg and FFprobe
        run: choco install ffmpeg --version=8.0.1 --yes --no-progress
      - name: Verify user journey
        run: python -m pytest -q tests/test_pipeline.py::${{ matrix.test }}
